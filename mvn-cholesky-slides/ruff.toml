line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]  # zip(lines, lines[1:]) pairs neighbours; strict= would be wrong

[lint.per-file-ignores]
# Manim code uses `from manim import *` by convention, and scene files must
# extend sys.path before importing the project modules.
"components.py" = ["F403", "F405"]
"scenes/*.py" = ["E402", "F403", "F405", "I001"]
"tests/*.py" = ["E402"]
